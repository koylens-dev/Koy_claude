<!doctype html>
<html lang="en-GH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#9e3b22" />
    <title>You're offline · Irie's Cuisine</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbf6ef; color: #241612;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
      main { max-width: 420px; text-align: center; }
      h1 { font-family: Georgia, serif; font-size: 2.2rem; margin: 16px 0 8px; }
      p { color: #6b5a50; line-height: 1.6; }
      button { margin-top: 16px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: #9e3b22;
        color: #fff; font-weight: 600; font-size: 1rem; }
      img { width: 72px; height: 72px; border-radius: 18px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>We can't reach the internet right now. Your cart is saved on this phone — try again when you have signal.</p>
      <p>Already paid? Your order is safe: we'll text you updates by SMS.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
