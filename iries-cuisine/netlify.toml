# Netlify hosting for the PREVIEW site (iries-cuisine-preview.netlify.app).
# Production is planned on Vercel (vercel.json); see docs/SETUP_AND_DEPLOY.md.
# Netlify detects Next.js and applies its Next.js runtime automatically.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
