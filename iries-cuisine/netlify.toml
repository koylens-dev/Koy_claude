# Netlify hosting for the PREVIEW site (iries-cuisine-preview.netlify.app).
# Production is planned on Vercel (vercel.json); see docs/SETUP_AND_DEPLOY.md.
# The Next.js adapter is declared in [[plugins]] below.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify's Next.js adapter (server rendering, API routes, proxy.ts, images).
# Declared explicitly because this project was created through the API, so it
# isn't added automatically.
[[plugins]]
  package = "@netlify/plugin-nextjs"
